function emptyStore(){
  return { examDate:'2026-11-08', showDday:true, notes:[], mindmaps:{}, chunks:[], collections:[], nextNoteId:1, nextChunkId:1, nextCollectionId:1 };
}

/* ---------- 반응형 store: 바뀐 부분(meta/notes/mindmaps/chunks)만 추적해서 저장 ---------- */
function makeReactive(obj, onChange){
  if(typeof obj !== 'object' || obj === null) return obj;
  for(const key in obj){ obj[key] = makeReactive(obj[key], onChange); }
  return new Proxy(obj, {
    set(target, prop, value){ target[prop] = makeReactive(value, onChange); onChange(); return true; },
    deleteProperty(target, prop){ delete target[prop]; onChange(); return true; },
  });
}
const dirty = { meta:false, notes:false, mindmaps:false, chunks:false };
function bucketFor(prop){
  if(prop==='notes' || prop==='mindmaps' || prop==='chunks') return prop;
  return 'meta'; // examDate, showDday, nextNoteId, nextChunkId, nextCollectionId, collections
}
function markDirty(key){ dirty[key] = true; persistAll(); }
function makeReactiveTop(obj){
  for(const key in obj){ obj[key] = makeReactive(obj[key], ()=> markDirty(bucketFor(key))); }
  return new Proxy(obj, {
    set(target, prop, value){
      target[prop] = makeReactive(value, ()=> markDirty(bucketFor(prop)));
      markDirty(bucketFor(prop));
      return true;
    },
    deleteProperty(target, prop){ delete target[prop]; markDirty(bucketFor(prop)); return true; },
  });
}
let persistTimer = null;
function persistAll(){
  if(!FIREBASE_ENABLED || !currentUser) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    const ref = db.collection('users').doc(currentUser.uid).collection('data');
    if(dirty.meta){
      ref.doc('meta').set({ examDate: store.examDate, showDday: store.showDday, nextNoteId: store.nextNoteId, nextChunkId: store.nextChunkId, nextCollectionId: store.nextCollectionId, collections: store.collections });
      dirty.meta = false;
    }
    if(dirty.notes){ ref.doc('notes').set({ items: store.notes }); dirty.notes = false; }
    if(dirty.mindmaps){ ref.doc('mindmaps').set({ items: store.mindmaps }); dirty.mindmaps = false; }
    if(dirty.chunks){ ref.doc('chunks').set({ items: store.chunks }); dirty.chunks = false; }
  }, 600);
}

let store = FIREBASE_ENABLED ? makeReactiveTop(emptyStore()) : makeReactiveTop(DEMO_SEED_STORE);

  const d = new Date(dateStr);

  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------- 오늘의 복습 (플래시카드) ---------- */
function openReviewSession(dueNotes){
  if(dueNotes.length === 0) return;
  let idx = 0, correctCount = 0, wrongCount = 0, revealed = false;
  const queue = [...dueNotes];

  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;background:var(--desk);z-index:400;display:flex;flex-direction:column;';
  document.body.appendChild(backdrop);

  function draw(){
    if(idx >= queue.length){
      backdrop.innerHTML = `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
          <div style="font-size:34px;margin-bottom:10px;">🎉</div>
          <div style="font-size:16px;font-weight:700;margin-bottom:6px;">오늘의 복습 완료!</div>
          <div style="font-size:13px;color:rgba(var(--text-muted-rgb),0.5);margin-bottom:20px;">기억함 ${correctCount}건 · 다시 볼게요 ${wrongCount}건</div>
          <button class="btn primary" id="reviewDone">홈으로</button>
        </div>`;
      backdrop.querySelector('#reviewDone').addEventListener('click', ()=>{ backdrop.remove(); render(); });
      return;
    }
    const n = queue[idx];
    revealed = false;
    backdrop.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid rgba(var(--border-rgb),0.08);">
        <button id="reviewClose" style="background:rgba(var(--border-rgb),0.08);border:none;color:var(--paper);width:28px;height:28px;border-radius:50%;cursor:pointer;">✕</button>
        <div style="flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(var(--text-muted-rgb),0.5);">${idx+1} / ${queue.length}</div>
        <div style="width:28px;"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;overflow-y:auto;">
        <div style="font-size:10.5px;font-weight:700;color:var(--amber-soft);text-align:center;margin-bottom:10px;">${n.subject} · ${n.unit}</div>
        <div style="background:var(--card);border-radius:14px;padding:20px;font-size:14px;line-height:1.7;text-align:center;margin-bottom:16px;">${n.ocrText}</div>
        <div id="revealArea"></div>
      </div>
      <div id="actionArea" style="padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(var(--border-rgb),0.08);"></div>
    `;
    backdrop.querySelector('#reviewClose').addEventListener('click', ()=>{ backdrop.remove(); render(); });
    const actionArea = backdrop.querySelector('#actionArea');
    const revealArea = backdrop.querySelector('#revealArea');

    function showAnswer(){
      revealed = true;
      revealArea.innerHTML = `
        ${n.answer ? `<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--blue-soft);">정답 ${n.answer}</div>` : ''}
        <div style="font-size:12px;margin-bottom:8px;"><b style="color:rgba(var(--text-muted-rgb),0.5);">오답사유</b><br>${n.wrongReason}</div>
        <div class="content-text" style="font-size:12.5px;background:rgba(232,163,61,0.12);border-radius:10px;padding:11px 13px;"><b style="color:var(--amber-soft);">정확한 개념</b><br>${n.correctConcept}</div>
      `;
      actionArea.innerHTML = `
        <div style="display:flex;gap:8px;">
          <button class="btn" id="wrongBtn" style="flex:1;background:var(--danger);color:#fff;padding:13px;">다시 볼게요</button>
          <button class="btn" id="rightBtn" style="flex:1;background:var(--blue);color:#fff;padding:13px;">기억함</button>
        </div>`;
      actionArea.querySelector('#wrongBtn').addEventListener('click', ()=> answer(n, false));
      actionArea.querySelector('#rightBtn').addEventListener('click', ()=> answer(n, true));
    }
    actionArea.innerHTML = `<button class="btn primary" id="revealBtn" style="width:100%;padding:13px;">정답 보기</button>`;
    actionArea.querySelector('#revealBtn').addEventListener('click', showAnswer);
  }

  function answer(note, correct){
    const realNote = store.notes.find(x=>x.id===note.id);
    realNote.reviewCount = (realNote.reviewCount||0) + 1;
    if(correct){
      realNote.masteryLevel = Math.min(3, (realNote.masteryLevel||0)+1);
      realNote.correctCount = (realNote.correctCount||0) + 1;
      correctCount++;
    } else {
      realNote.masteryLevel = Math.max(0, (realNote.masteryLevel||0)-1);
      realNote.wrongCount = (realNote.wrongCount||0) + 1;
      wrongCount++;
    }
    realNote.lastReviewedAt = '2026-08-08';
    realNote.nextReviewAt = addDays('2026-08-08', REVIEW_INTERVALS[realNote.masteryLevel]);
    idx++;
    draw();
  }

  draw();
}

    <div class="row" style="margin-bottom:10px;" id="subjChips"></div>
    <div id="resultArea"></div>
  `;
  root.appendChild(wrap);

  const favChip = document.createElement('button');
  favChip.className = 'chip'; favChip.textContent = '⭐ 즐겨찾기만';
  favChip.addEventListener('click', ()=>{ state.favOnly = !state.favOnly; favChip.classList.toggle('active'); update(); });
  wrap.querySelector('#subjChips').appendChild(favChip);

  store.collections.forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'chip'; chip.textContent = '📁 '+c.name;
    chip.addEventListener('click', ()=>{ state.collectionId = state.collectionId===c.id ? null : c.id; wrap.querySelectorAll('.coll-filter-chip').forEach(x=>x.classList.remove('active')); if(state.collectionId) chip.classList.add('active'); update(); });
    chip.classList.add('coll-filter-chip');
    wrap.querySelector('#subjChips').appendChild(chip);
  });

  SUBJECTS.forEach(s=>{
    const chip = document.createElement('button');
    chip.className = 'chip'; chip.textContent = s;
    chip.addEventListener('click', ()=>{ state.subjects.has(s)?state.subjects.delete(s):state.subjects.add(s); chip.classList.toggle('active'); update(); });
    wrap.querySelector('#subjChips').appendChild(chip);
  });
  wrap.querySelector('#searchIn').addEventListener('input', e=>{ state.search = e.target.value.toLowerCase(); update(); });
  wrap.querySelector('#conceptModeBtn').addEventListener('click', (e)=>{
    state.mode = state.mode==='card' ? 'concept' : 'card';
    e.target.classList.toggle('primary'); e.target.classList.toggle('ghost');
    update();
  });

  function filtered(){
    return store.notes.filter(n=>{
      if(state.favOnly && !n.favorite) return false;
      if(state.collectionId && !(n.collectionIds||[]).includes(state.collectionId)) return false;
      if(state.subjects.size && !state.subjects.has(n.subject)) return false;
      if(state.search){
        const hay = (n.ocrText+n.correctConcept+n.wrongReason+n.tags.join(' ')+n.unit).toLowerCase();
        if(!hay.includes(state.search)) return false;
      }
      return true;
    });
  }
  function update(){
    const area = wrap.querySelector('#resultArea');
    const list = filtered();
    if(list.length===0){ area.innerHTML = '<div style="color:rgba(var(--text-muted-rgb),0.35);font-size:13px;padding:40px 0;text-align:center;">결과가 없어요</div>'; return; }
    if(state.mode === 'concept'){
      const grouped = {};
      list.forEach(n=>(grouped[n.subject]||=[]).push(n));
      area.innerHTML = Object.keys(grouped).map(s=>`
        <div style="margin-bottom:16px;">
          <h3 style="font-size:12.5px;color:var(--amber-soft);font-family:'JetBrains Mono',monospace;margin:0 0 8px;">${s} <span style="color:rgba(var(--text-muted-rgb),0.35);font-weight:400;">${grouped[s].length}개</span></h3>
          ${grouped[s].map(n=>`<div style="background:var(--desk-2);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:7px;">
            <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;color:rgba(var(--text-muted-rgb),0.35);margin-bottom:3px;">${n.unit} · ${n.source}</div>
            <p class="content-text" style="margin:0;font-size:12.5px;line-height:1.6;">${n.correctConcept}</p>
          </div>`).join('')}
        </div>`).join('');
      return;
    }
    area.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;">` +
      list.map(n=>{
        const due = isDue(n.nextReviewAt);
        return `<div class="note-card" data-id="${n.id}" style="background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid rgba(var(--border-rgb),0.05);">
          <div style="height:60px;background:${SUBJECT_COLORS[n.subject]};display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;position:relative;padding:0 34px;text-align:center;line-height:1.25;">
            ${subjectBadge(n.subject)}
            <button class="fav-star" data-id="${n.id}" style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.35);border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;color:${n.favorite?'var(--amber)':'rgba(var(--border-rgb),0.6)'};">${n.favorite?'★':'☆'}</button>
            <span style="position:absolute;top:6px;right:6px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;background:${due?'var(--danger)':'rgba(0,0,0,0.35)'};color:${due?'#fff':'var(--amber-soft)'};">${ddayStr(n.nextReviewAt)}</span>
          </div>
          <div style="padding:10px 11px;">
            <div style="font-size:10px;font-weight:700;color:var(--amber-soft);margin-bottom:4px;">${n.subject} · ${n.mistakeType}</div>
            <div class="content-text" style="font-size:11px;color:rgba(var(--text-muted-rgb),0.85);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${n.correctConcept}</div>
          </div>
        </div>`;
      }).join('') + `</div>`;
    area.querySelectorAll('.fav-star').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const note = store.notes.find(n=>n.id==btn.dataset.id);
        note.favorite = !note.favorite;
        update();
      });
    });
    area.querySelectorAll('.note-card').forEach(el=>{
      el.addEventListener('click', ()=> openNoteModal(store.notes.find(n=>n.id==el.dataset.id)));
    });
  }
  update();
}

function openNoteModal(note){
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:300;';
  backdrop.innerHTML = `
    <div style="background:var(--card);border-radius:16px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto;padding:20px 22px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
        <h3 style="margin:0;font-size:15px;">${note.unit}</h3>
        <div style="display:flex;gap:6px;">
          <button id="favToggle" style="background:rgba(var(--border-rgb),0.08);border:none;color:${note.favorite?'var(--amber)':'var(--paper)'};width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;">${note.favorite?'★':'☆'}</button>
          <button id="closeModal" style="background:rgba(var(--border-rgb),0.08);border:none;color:var(--paper);width:24px;height:24px;border-radius:50%;cursor:pointer;">✕</button>
        </div>
      </div>
      <div style="font-size:11px;color:rgba(var(--text-muted-rgb),0.4);margin-bottom:12px;">${note.subject} · ${note.mistakeType} · ${note.source}</div>
      ${note.images && note.images.length ? `<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;">${note.images.map(src=>`<img src="${src}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;flex-shrink:0;">`).join('')}</div>` : ''}
      <div class="content-text" style="font-size:12px;margin-bottom:10px;"><b style="color:rgba(var(--text-muted-rgb),0.5);">문제</b><br>${note.ocrText}</div>
      ${note.answer ? `<div style="font-size:12px;margin-bottom:10px;"><b style="color:rgba(var(--text-muted-rgb),0.5);">정답</b> ${note.answer}</div>` : ''}
      <div class="content-text" style="font-size:12px;margin-bottom:10px;"><b style="color:rgba(var(--text-muted-rgb),0.5);">오답사유</b><br>${note.wrongReason}</div>
      <div class="content-text" style="font-size:12px;background:rgba(232,163,61,0.1);border-radius:8px;padding:9px 11px;margin-bottom:14px;"><b style="color:var(--amber-soft);">정확한 개념</b><br>${note.correctConcept}</div>
      <div style="margin-bottom:14px;">
        <label style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;color:rgba(var(--text-muted-rgb),0.4);text-transform:uppercase;display:block;margin-bottom:6px;">컬렉션</label>
        <div id="collChipsWrap" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn blue" id="toMindmap">＋ 마인드맵에 추가</button>
        <button class="btn blue" id="toChunk">＋ 청크로 요약</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const collWrap = backdrop.querySelector('#collChipsWrap');
  function drawCollChips(){
    collWrap.innerHTML = store.collections.map(c=>{
      const inColl = note.collectionIds && note.collectionIds.includes(c.id);
      return `<button class="chip coll-chip ${inColl?'active':''}" data-cid="${c.id}">${c.name}</button>`;
    }).join('') + `<button class="chip" id="newCollBtn">＋ 새 컬렉션</button>`;
    collWrap.querySelectorAll('.coll-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cid = btn.dataset.cid;
        const coll = store.collections.find(c=>c.id===cid);
        if(!note.collectionIds) note.collectionIds = [];
        if(note.collectionIds.includes(cid)){
          note.collectionIds = note.collectionIds.filter(x=>x!==cid);
          coll.noteIds = coll.noteIds.filter(x=>x!==note.id);
        } else {
          note.collectionIds.push(cid);
          coll.noteIds.push(note.id);
        }
        drawCollChips();
      });
    });
    collWrap.querySelector('#newCollBtn').addEventListener('click', ()=>{
      const name = prompt('새 컬렉션 이름을 입력하세요 (예: 이번 주 볼 것)');
      if(!name) return;
      const id = 'c'+store.nextCollectionId++;
      store.collections.push({id, name, noteIds:[note.id]});
      if(!note.collectionIds) note.collectionIds = [];
      note.collectionIds.push(id);
      drawCollChips();
    });
  }
  drawCollChips();
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('#closeModal').addEventListener('click', ()=> backdrop.remove());
  backdrop.querySelector('#favToggle').addEventListener('click', (e)=>{
    note.favorite = !note.favorite;
    e.target.textContent = note.favorite ? '★' : '☆';
    e.target.style.color = note.favorite ? 'var(--amber)' : 'var(--paper)';
  });
  backdrop.querySelector('#toMindmap').addEventListener('click', ()=>{
    if(!store.mindmaps[note.subject]) store.mindmaps[note.subject] = {id:'root', label:note.subject, detail:'', children:[]};
    store.mindmaps[note.subject].children.push({id:'n'+Date.now(), label:note.unit, detail:note.correctConcept, children:[]});
    showToast('마인드맵에 추가되었습니다');
  });
  backdrop.querySelector('#toChunk').addEventListener('click', ()=>{
    store.chunks.push({id:store.nextChunkId++, text:note.correctConcept.slice(0,40)+'…', subject:note.subject, color:Math.floor(Math.random()*STICKY_COLORS.length), x:40+Math.random()*200, y:40+Math.random()*150});
    showToast('청킹 보드에 카드가 생성되었습니다');
  });
}

        ${i===0?'<span style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);color:#fff;font-size:8px;text-align:center;">메인</span>':`<button class="rm-extra" data-i="${i}" style="position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;border:none;background:rgba(0,0,0,0.5);color:#fff;font-size:9px;cursor:pointer;">×</button>`}
      </div>`).join('');
    row.querySelectorAll('.rm-extra').forEach(btn=>{
      btn.addEventListener('click', ()=>{ capturedImages.splice(parseInt(btn.dataset.i,10),1); renderExtraThumbs(); });
    });
  }
  wrap.querySelector('#addExtraImgBtn').addEventListener('click', ()=> wrap.querySelector('#extraImgInput').click());
  wrap.querySelector('#extraImgInput').addEventListener('change', (e)=>{
    [...e.target.files].forEach(f=>{
      const r = new FileReader();
      r.onload = ev=>{ capturedImages.push(ev.target.result); renderExtraThumbs(); };
      r.readAsDataURL(f);
    });
  });

  // ---------- 이미지 로드: 이미지 + 옆 여백을 하나의 캔버스로 구성 ----------
  function loadImage(src){
    const probe = new Image();
    probe.onload = ()=>{
      empty.hidden = true; stage.hidden = false;
      imgNaturalW = probe.naturalWidth; imgNaturalH = probe.naturalHeight;

      const containerMax = Math.min(canvasShell.clientWidth - 28, 760) || 640;
      let dispW = imgNaturalW, dispH = imgNaturalH;
      if(dispW > containerMax){ const r = containerMax/dispW; dispW = containerMax; dispH = dispH*r; }
      const maxH = 640;
      if(dispH > maxH){ const r = maxH/dispH; dispH = maxH; dispW = dispW*r; }

      marginW = Math.max(160, dispW * MARGIN_RATIO);
      const totalW = dispW + marginW;

      stage.innerHTML = `
        <div style="display:flex;">
          <img id="cImg" src="${src}" style="display:block;width:${dispW}px;height:${dispH}px;border-radius:6px 0 0 6px;">
          <div style="width:${marginW}px;height:${dispH}px;background:var(--paper);border-radius:0 6px 6px 0;border:1.5px dashed rgba(var(--border-rgb),0.2);border-left:none;position:relative;">
            <span style="position:absolute;top:6px;left:8px;font-size:9.5px;color:rgba(34,38,47,0.35);font-family:'JetBrains Mono',monospace;">✏️ 정답/메모 여백</span>
          </div>
        </div>
        <canvas id="cCanvas" style="position:absolute;top:0;left:0;width:${totalW}px;height:${dispH}px;touch-action:none;"></canvas>
      `;
      imgEl = stage.querySelector('#cImg');
      canvas = stage.querySelector('#cCanvas');
      ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = totalW*dpr; canvas.height = dispH*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);

      state.hasImage = true;
      toolbar.style.display = 'flex';
      wrap.querySelector('#cFloatingTools').style.display = 'flex';
      wrap.querySelector('#cAnalyzeBtn').style.display = 'inline-block';
      capturedImages[0] = src;
      renderExtraThumbs();
      strokes = []; redoStack = [];
      attachCanvasEvents();
    };
    probe.src = src;
  }

  wrap.querySelector('#cUpload').addEventListener('click', ()=> wrap.querySelector('#cFileInput').click());
  wrap.querySelector('#cCamera').addEventListener('click', ()=> wrap.querySelector('#cCameraInput').click());
  [wrap.querySelector('#cFileInput'), wrap.querySelector('#cCameraInput')].forEach(inp=>{
    inp.addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = ev=>loadImage(ev.target.result); r.readAsDataURL(f);
    });
  });
  wrap.querySelector('#cPaste').addEventListener('click', async ()=>{
    try{
      const items = await navigator.clipboard.read();
      for(const ci of items){
        const t = ci.types.find(x=>x.startsWith('image/'));
        if(t){ const blob = await ci.getType(t); const r=new FileReader(); r.onload=ev=>loadImage(ev.target.result); r.readAsDataURL(blob); return; }
      }
      alert('클립보드에 이미지가 없어요.');
    }catch(err){ alert('화면을 탭하고 ⌘V로 붙여넣어주세요.'); }
  });
  window.addEventListener('paste', (e)=>{
    if(currentTab!=='notes' || notesSubview!=='capture') return;
    const items = e.clipboardData?.items; if(!items) return;
    for(const it of items){ if(it.type.startsWith('image/')){ const f=it.getAsFile(); const r=new FileReader(); r.onload=ev=>loadImage(ev.target.result); r.readAsDataURL(f); e.preventDefault(); break; } }
  });

  // ---------- 획(stroke) 기반 드로잉 엔진 ----------
  let strokes = [], redoStack = [];

  function widthFor(tool, size, pressure){
    if(tool==='pencil') return size*(0.4+pressure*1.2);
    if(tool==='fountain') return size*(0.3+pressure*1.4);
    if(tool==='ballpoint') return size*(0.6+pressure*0.5);
    if(tool==='highlighter') return size*2.2;
    if(tool==='eraser') return size*2;
    return size;
  }

  function renderAllStrokes(){
    if(!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.restore();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    strokes.forEach(s=> paintStroke(s));
  }

  function paintStroke(s){
    if(s.type==='pen' || s.type==='erase'){
      const tool = s.type==='erase' ? 'eraser' : s.tool;
      ctx.globalCompositeOperation = tool==='eraser' ? 'destination-out' : (tool==='highlighter' ? 'multiply' : 'source-over');
      ctx.globalAlpha = tool==='highlighter' ? 0.35 : 1;
      ctx.strokeStyle = tool==='eraser' ? '#000' : s.color;
      ctx.fillStyle = tool==='eraser' ? '#000' : s.color;
      ctx.lineCap='round'; ctx.lineJoin='round';
      const pts = s.points;
      if(pts.length===1){
        const w = widthFor(tool, s.size, pts[0].pressure);
        ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,w/2,0,Math.PI*2); ctx.fill();
      } else {
        for(let i=0;i<pts.length-1;i++){
          ctx.lineWidth = widthFor(tool, s.size, pts[i+1].pressure);
          ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i+1].x,pts[i+1].y); ctx.stroke();
        }
      }
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    } else if(s.type==='rect'){
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle = s.color; ctx.lineWidth = Math.max(2, s.size*0.7);
      ctx.strokeRect(s.x, s.y, s.w, s.h);
    } else if(s.type==='underline'){
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle=s.color; ctx.lineWidth=Math.max(3,s.size*0.8); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y1); ctx.stroke();
    } else if(s.type==='star'){
      ctx.globalCompositeOperation='source-over'; ctx.fillStyle=s.color;
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const rad = i%2===0?s.r:s.r*0.45;
        const ang = (Math.PI/5)*i - Math.PI/2;
        const px=s.cx+rad*Math.cos(ang), py=s.cy+rad*Math.sin(ang);
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
    }
  }

  function commitStroke(s){ strokes.push(s); redoStack=[]; }

  wrap.querySelector('#btnUndo').addEventListener('click', ()=>{
    if(strokes.length===0) return;
    redoStack.push(strokes.pop());
    renderAllStrokes();
  });
  wrap.querySelector('#btnRedo').addEventListener('click', ()=>{
    if(redoStack.length===0) return;
    strokes.push(redoStack.pop());
    renderAllStrokes();
  });
  wrap.querySelector('#btnClearCanvas').addEventListener('click', ()=>{
    strokes=[]; redoStack=[]; renderAllStrokes();
  });

  // ---------- 획 전체 지우기(탭한 획 찾기) ----------
  function distToSegment(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    let t = len2===0 ? 0 : ((px-x1)*dx+(py-y1)*dy)/len2;
    t = Math.max(0, Math.min(1, t));
    const cx=x1+t*dx, cy=y1+t*dy;
    return Math.hypot(px-cx, py-cy);
  }
  function hitTestStroke(s, px, py){
    if(s.type==='pen'){
      const tol = Math.max(12, s.size);
      if(s.points.length===1) return Math.hypot(px-s.points[0].x, py-s.points[0].y) < tol;
      for(let i=0;i<s.points.length-1;i++){
        if(distToSegment(px,py,s.points[i].x,s.points[i].y,s.points[i+1].x,s.points[i+1].y) < tol) return true;
      }
      return false;
    }
    if(s.type==='underline') return distToSegment(px,py,s.x1,s.y1,s.x2,s.y1) < Math.max(10,s.size);
    if(s.type==='rect'){
      const tol=10;
      return (Math.abs(px-s.x)<tol && py>=s.y-tol && py<=s.y+s.h+tol) ||
             (Math.abs(px-(s.x+s.w))<tol && py>=s.y-tol && py<=s.y+s.h+tol) ||
             (Math.abs(py-s.y)<tol && px>=s.x-tol && px<=s.x+s.w+tol) ||
             (Math.abs(py-(s.y+s.h))<tol && px>=s.x-tol && px<=s.x+s.w+tol);
    }
    if(s.type==='star') return Math.hypot(px-s.cx, py-s.cy) < s.r+10;
    return false;
  }
  function eraseStrokeAt(px, py){
    for(let i=strokes.length-1; i>=0; i--){
      if(strokes[i].type==='erase') continue; // 지우개 자국 자체는 대상 아님
      if(hitTestStroke(strokes[i], px, py)){
        strokes.splice(i,1);
        redoStack=[];
        renderAllStrokes();
        return true;
      }
    }
    return false;
  }

  // ---------- 실시간 드로잉 ----------
  let drawing=false, currentStroke=null, shapeStartX=0, shapeStartY=0;
  let activePenId = null; // 팜 리젝션: 펜이 활성 상태일 땐 손가락 터치 무시
  let activeTouchIds = new Set(); // 두 손가락 탭 감지용
  function pos(e){ const r = canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

  function attachCanvasEvents(){
    canvas.addEventListener('pointerdown', (e)=>{
      // ---- 팜 리젝션 ----
      if(e.pointerType === 'pen'){
        activePenId = e.pointerId;
      } else if(e.pointerType === 'touch'){
        activeTouchIds.add(e.pointerId);
        if(activePenId !== null) return; // 펜 사용 중엔 손가락 입력 무시(손바닥 오인식 방지)
        if(activeTouchIds.size === 2){
          // 두 손가락 탭 = 실행취소
          wrap.querySelector('#btnUndo')?.click();
          return;
        }
        if(activeTouchIds.size > 1) return; // 세 손가락 이상은 무시
      }

      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      drawing = true;

      if(state.tool==='eraser-stroke'){
        state.hasAnnotation = true;
        eraseStrokeAt(p.x, p.y);
        return;
      }
      if(['rect','underline','star'].includes(state.tool)){
        shapeStartX=p.x; shapeStartY=p.y;
        if(state.tool==='star'){
          state.hasAnnotation = true;
          commitStroke({type:'star', color:state.color, r:26, cx:p.x, cy:p.y});
          renderAllStrokes();
          drawing=false;
        }
        return;
      }
      state.hasAnnotation = true;
      const pressure = e.pressure>0?e.pressure:0.5;
      const type = state.tool==='eraser' ? 'erase' : 'pen';
      currentStroke = { type, tool:state.tool, color:state.color, size:state.size, points:[{x:p.x,y:p.y,pressure}] };
      paintStroke(currentStroke);
    });
    canvas.addEventListener('pointermove', (e)=>{
      if(e.pointerType==='touch' && activePenId!==null) return;
      if(!drawing) return;
      const p = pos(e);
      const pressure = e.pressure>0?e.pressure:0.5;

      if(state.tool==='eraser-stroke'){ eraseStrokeAt(p.x, p.y); return; }

      if(state.tool==='rect' || state.tool==='underline'){
        renderAllStrokes();
        if(state.tool==='rect'){
          ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=state.color; ctx.lineWidth=Math.max(2,state.size*0.7);
          ctx.strokeRect(Math.min(shapeStartX,p.x), Math.min(shapeStartY,p.y), Math.abs(p.x-shapeStartX), Math.abs(p.y-shapeStartY));
        } else {
          ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=state.color; ctx.lineWidth=Math.max(3,state.size*0.8); ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(shapeStartX,shapeStartY); ctx.lineTo(p.x,shapeStartY); ctx.stroke();
        }
        return;
      }
      if(!currentStroke) return;
      const prevPt = currentStroke.points[currentStroke.points.length-1];
      currentStroke.points.push({x:p.x,y:p.y,pressure});
      const seg = { ...currentStroke, points:[prevPt, {x:p.x,y:p.y,pressure}] };
      paintStroke(seg);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
      canvas.addEventListener(evt, (e)=>{
        if(e.pointerType==='pen' && e.pointerId===activePenId) activePenId = null;
        if(e.pointerType==='touch') activeTouchIds.delete(e.pointerId);
        if(!drawing) return;
        drawing = false;
        if(state.tool==='eraser-stroke') return;
        if(state.tool==='rect' || state.tool==='underline'){
          const p = pos(e);
          if(Math.abs(p.x-shapeStartX)>3 || Math.abs(p.y-shapeStartY)>3){
            if(state.tool==='rect'){
              commitStroke({type:'rect', color:state.color, size:state.size, x:Math.min(shapeStartX,p.x), y:Math.min(shapeStartY,p.y), w:Math.abs(p.x-shapeStartX), h:Math.abs(p.y-shapeStartY)});
            } else {
              commitStroke({type:'underline', color:state.color, size:state.size, x1:shapeStartX, y1:shapeStartY, x2:p.x});
            }
          }
          renderAllStrokes();
          return;
        }
        if(currentStroke){ commitStroke(currentStroke); currentStroke=null; }
      });
    });
  }

  wrap.querySelector('#cAnalyzeBtn').addEventListener('click', function(){
    this.textContent = '분석 중...'; this.disabled = true;
    setTimeout(()=>{
      const mock = {
        ocrText:'15. 다음 중 영양판정 방법 중 생화학적 방법에 해당하는 것은?',
        subject:'영양판정', unit:'생화학적 판정', confidence:92, tags:['생화학적판정','혈청알부민'],
      };
      let resultHtml = `<div style="background:rgba(62,107,158,0.1);border:1px solid rgba(62,107,158,0.3);border-radius:10px;padding:10px 12px;font-size:12px;">
        <div style="margin-bottom:6px;">${mock.ocrText}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--blue-soft);">추정 과목 ${mock.subject} (${mock.confidence}%) · ${mock.tags.join(', ')}</div>`;
      wrap.querySelector('#cSubject').value = mock.subject;

      if(state.hasAnnotation){
        const detectedAnswer = '③';
        resultHtml += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(62,107,158,0.25);font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--amber-soft);">✏️ 여백 필기에서 정답 표시 감지: <b>${detectedAnswer}</b> (인식률 낮을 수 있음)</div>`;
        wrap.querySelector('#cAnswer').value = detectedAnswer;
        wrap.querySelector('#cAnswerHint').style.display = 'block';
      }
      resultHtml += `</div>`;
      wrap.querySelector('#cOcrResult').style.display = 'block';
      wrap.querySelector('#cOcrResult').innerHTML = resultHtml;
      this.textContent = '다시 분석'; this.disabled = false;
    }, 900);
  }.bind(wrap.querySelector('#cAnalyzeBtn')));

  wrap.querySelector('#cAnswerClear').addEventListener('click', ()=>{
    const input = wrap.querySelector('#cAnswer');
    input.value=''; input.focus();
  });
  wrap.querySelector('#cSaveBtn').addEventListener('click', ()=>{
    const subject = wrap.querySelector('#cSubject').value;
    const note = {
      id: store.nextNoteId++,
      subject, unit: wrap.querySelector('#cOcrResult').style.display==='block' ? '생화학적 판정' : '새 오답노트',
      tags:[], mistakeType: wrap.querySelector('#cMistake').value,
      ocrText: '(캡처된 문제 이미지)',
      answer: wrap.querySelector('#cAnswer').value || '',
      wrongReason: wrap.querySelector('#cWrongReason').value || '(미입력)',
      correctConcept: wrap.querySelector('#cConcept').value || '(미입력)',
      source:'직접 등록', createdAt:'2026-08-08', nextReviewAt:'2026-08-09', masteryLevel:0, reviewCount:0, correctCount:0, wrongCount:0, favorite:false, collectionIds:[], images: capturedImages.slice(),
    };
    store.notes.push(note);
    showToast('오답노트가 저장되었습니다');
    notesSubview = 'list';
    switchTab('notes');
  });
}

function renderQuizSetup(root){
  const wrap = document.createElement('div');
  wrap.className = 'pad';
  const state = { subjects:new Set() };
  wrap.innerHTML = `
    <div style="font-size:13px;color:rgba(var(--text-muted-rgb),0.6);line-height:1.6;margin-bottom:12px;">저장된 오답노트의 정확한 개념으로 4지선다 문제를 자동 생성합니다. 과목을 선택하지 않으면 전체에서 출제해요.</div>
    <div class="row" style="margin-bottom:16px;" id="quizSubjChips"></div>
    <button class="btn primary" id="startQuizBtn" style="width:100%;padding:13px;">퀴즈 시작</button>
  `;
  root.appendChild(wrap);
  SUBJECTS.forEach(s=>{
    const chip = document.createElement('button');
    chip.className='chip'; chip.textContent=s;
    chip.addEventListener('click', ()=>{ state.subjects.has(s)?state.subjects.delete(s):state.subjects.add(s); chip.classList.toggle('active'); });
    wrap.querySelector('#quizSubjChips').appendChild(chip);
  });
  wrap.querySelector('#startQuizBtn').addEventListener('click', ()=>{
    const pool = state.subjects.size ? store.notes.filter(n=>state.subjects.has(n.subject)) : store.notes;
    if(pool.length < 2){ alert('퀴즈를 만들려면 오답노트가 최소 2건 이상 필요해요.'); return; }
    openQuizSession(pool);
  });
}

function openQuizSession(pool){
  let idx = 0, correct = 0, wrong = 0;
  const questions = [...pool].sort(()=>Math.random()-0.5);
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;background:var(--desk);z-index:400;display:flex;flex-direction:column;';
  document.body.appendChild(backdrop);

  function buildOptions(correctNote){
    const distractorPool = store.notes.filter(n=>n.id!==correctNote.id && n.correctConcept !== correctNote.correctConcept);
    const shuffled = distractorPool.sort(()=>Math.random()-0.5);
    const optionCount = Math.min(4, distractorPool.length+1);
    const distractors = shuffled.slice(0, optionCount-1).map(n=>n.correctConcept);
    const options = [correctNote.correctConcept, ...distractors].sort(()=>Math.random()-0.5);
    return options;
  }

  function draw(){
    if(idx >= questions.length){
      backdrop.innerHTML = `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
          <div style="font-size:34px;margin-bottom:10px;">📝</div>
          <div style="font-size:16px;font-weight:700;margin-bottom:6px;">퀴즈 완료!</div>
          <div style="font-size:13px;color:rgba(var(--text-muted-rgb),0.5);margin-bottom:20px;">정답 ${correct} / ${questions.length} (${Math.round(correct/questions.length*100)}%)</div>
          <button class="btn primary" id="quizDone">오답노트로</button>
        </div>`;
      backdrop.querySelector('#quizDone').addEventListener('click', ()=>{ backdrop.remove(); render(); });
      return;
    }
    const n = questions[idx];
    const options = buildOptions(n);
    backdrop.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid rgba(var(--border-rgb),0.08);">
        <button id="quizClose" style="background:rgba(var(--border-rgb),0.08);border:none;color:var(--paper);width:28px;height:28px;border-radius:50%;cursor:pointer;">✕</button>
        <div style="flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(var(--text-muted-rgb),0.5);">${idx+1} / ${questions.length}</div>
        <div style="width:28px;"></div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:24px;">
        <div style="font-size:10.5px;font-weight:700;color:var(--amber-soft);text-align:center;margin-bottom:10px;">${n.subject} · ${n.unit}</div>
        <div style="background:var(--card);border-radius:14px;padding:18px;font-size:13.5px;line-height:1.6;text-align:center;margin-bottom:18px;">${n.ocrText}<br><span style="font-size:11px;color:rgba(var(--text-muted-rgb),0.5);">위 문제에 대한 정확한 개념 설명으로 옳은 것은?</span></div>
        <div id="quizOptions" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    `;
    backdrop.querySelector('#quizClose').addEventListener('click', ()=>{ backdrop.remove(); render(); });
    const optWrap = backdrop.querySelector('#quizOptions');
    options.forEach(opt=>{
      const b = document.createElement('button');
      b.style.cssText = 'text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(var(--border-rgb),0.1);background:var(--desk-2);color:var(--paper);font-size:12.5px;line-height:1.5;cursor:pointer;font-family:"Noto Sans KR",sans-serif;';
      b.textContent = opt;
      b.addEventListener('click', ()=>{
        optWrap.querySelectorAll('button').forEach(x=>x.disabled=true);
        const isCorrect = opt === n.correctConcept;
        b.style.borderColor = isCorrect ? 'var(--blue)' : 'var(--danger)';
        b.style.background = isCorrect ? 'rgba(62,107,158,0.15)' : 'rgba(201,122,82,0.15)';
        if(!isCorrect){
          optWrap.querySelectorAll('button').forEach(x=>{ if(x.textContent===n.correctConcept){ x.style.borderColor='var(--blue)'; x.style.background='rgba(62,107,158,0.15)'; } });
        }
        const realNote = store.notes.find(x=>x.id===n.id);
        realNote.reviewCount = (realNote.reviewCount||0)+1;
        if(isCorrect){ realNote.correctCount=(realNote.correctCount||0)+1; correct++; }
        else{ realNote.wrongCount=(realNote.wrongCount||0)+1; wrong++; }
        setTimeout(()=>{ idx++; draw(); }, 900);
      });
      optWrap.appendChild(b);
    });
  }
  draw();
}

/* ============================== MINDMAP ============================== */
let mmSelectedId = {};
function renderMindmap(root){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;height:100%;min-height:0;';
  wrap.innerHTML = `<div class="row" style="padding:14px 20px 6px;gap:6px;flex-shrink:0;" id="mmTabs"></div>
    <div style="padding:0 20px 6px;font-size:11px;color:rgba(var(--text-muted-rgb),0.4);flex-shrink:0;">💡 ＋버튼 또는 노드 가장자리에서 선을 그어 키워드 추가 · 노드 중앙을 드래그하면 이동</div>
    <div style="display:flex;gap:12px;padding:8px 20px 20px;flex:1;min-height:320px;">
      <div id="mmCanvasShell" style="flex:2;min-width:280px;background:var(--desk-2);border-radius:14px;overflow:auto;position:relative;">
        <div id="mmCanvas" style="position:relative;"></div>
      </div>
      <div id="mmPanel" style="flex:1;min-width:220px;max-width:320px;background:var(--desk-2);border-radius:14px;padding:14px 16px;overflow-y:auto;"></div>
    </div>`;
  root.appendChild(wrap);

  const existingSubjects = Object.keys(store.mindmaps);
  const tabsWrap = wrap.querySelector('#mmTabs');
  let currentSubject = existingSubjects[0] || null;

  function buildTabs(){
    tabsWrap.innerHTML = '';
    existingSubjects.forEach(s=>{
      const b = document.createElement('button');
      b.className = 'chip' + (s===currentSubject?' active':'');
      b.textContent = s;
      b.addEventListener('click', ()=>{ currentSubject = s; buildTabs(); draw(); });
      tabsWrap.appendChild(b);
    });
    const addSel = document.createElement('select');
    addSel.className = 'chip';
    addSel.innerHTML = `<option value="">＋ 새 마인드맵</option>` + SUBJECTS.filter(s=>!store.mindmaps[s]).map(s=>`<option value="${s}">${s}</option>`).join('');
    addSel.addEventListener('change', ()=>{
      if(!addSel.value) return;
      store.mindmaps[addSel.value] = {id:'root', label:addSel.value, detail:'', children:[], x:320, y:220};
      existingSubjects.push(addSel.value);
      currentSubject = addSel.value;
      buildTabs(); draw();
    });
    tabsWrap.appendChild(addSel);
  }
  buildTabs();

  function findNode(node,id){ if(node.id===id) return node; for(const c of node.children){ const f=findNode(c,id); if(f) return f; } return null; }
  function findParent(node,id,p=null){ if(node.id===id) return p; for(const c of node.children){ const f=findParent(c,id,node); if(f) return f; } return null; }

  const W=150, H=36;
  const DEPTH_COLORS = ['#E8A33D','#3E6B9E','#4FC3C0','#7A5FA8','#C97A52','#6C9A5E'];
  const NODE_COLOR_CHOICES = ['#E8A33D','#3E6B9E','#4FC3C0','#7A5FA8','#C97A52','#6C9A5E','#C24B3F','#2C3140'];
  function colorForNode(n){
    if(n.color) return n.color;
    return DEPTH_COLORS[Math.min(n._depth||0, DEPTH_COLORS.length-1)];
  }
  function textColorFor(hex){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const lum = (0.299*r+0.587*g+0.114*b)/255;
    return lum > 0.6 ? '#241705' : '#F8F5EE';
  }

  // 레거시 데이터(좌표 없는 노드)에 위치를 자동 배정
  function ensurePosition(node, parent, siblingIdx){
    if(node.x===undefined || node.y===undefined){
      if(!parent){ node.x=320; node.y=220; }
      else {
        const angle = (siblingIdx*55 + 20) % 360, rad = angle*Math.PI/180, dist=200;
        node.x = parent.x + Math.cos(rad)*dist;
        node.y = parent.y + Math.sin(rad)*dist;
      }
    }
    node.children.forEach((c,i)=> ensurePosition(c, node, i));
  }

  function liveRoot(){ return store.mindmaps[currentSubject]; }

  function addChildTo(parentId, pos){
    const pRoot = liveRoot();
    const parentNode = findNode(pRoot, parentId);
    if(!parentNode) return;
    const id = 'n'+Date.now();
    let nx, ny;
    if(pos){
      nx = pos.x - W/2; ny = pos.y - H/2;
    } else {
      const idx = parentNode.children.length;
      const angle = (idx*55 + 20) % 360, rad = angle*Math.PI/180, dist=200;
      nx = parentNode.x+Math.cos(rad)*dist; ny = parentNode.y+Math.sin(rad)*dist;
    }
    const newNode = {id, label:'', detail:'', children:[], x:nx, y:ny};
    parentNode.children.push(newNode);
    mmSelectedId[currentSubject] = id;
    draw();
    startInlineEdit(id);
  }
  function deleteNode(id){
    if(!confirm('이 키워드와 하위 항목을 삭제할까요?')) return;
    const r = liveRoot();
    const p = findParent(r, id);
    if(p) p.children = p.children.filter(c=>c.id!==id);
    if(mmSelectedId[currentSubject]===id) mmSelectedId[currentSubject] = null;
    draw();
  }

  let editingId = null;
  function startInlineEdit(id){
    editingId = id;
    draw();
  }

  function draw(){
    const panel = wrap.querySelector('#mmPanel');
    const canvasWrap = wrap.querySelector('#mmCanvas');
    if(!currentSubject){ canvasWrap.innerHTML=''; panel.innerHTML='<div style="color:rgba(var(--text-muted-rgb),0.35);font-size:12.5px;">마인드맵을 추가해보세요</div>'; return; }
    const root2 = liveRoot();
    ensurePosition(root2, null, 0);

    const flatAll = []; (function collect(n, depth){ n._depth = depth; flatAll.push(n); n.children.forEach(c=>collect(c, depth+1)); })(root2, 0);

    let minX=root2.x, minY=root2.y, maxX=root2.x+W, maxY=root2.y+H;
    flatAll.forEach(n=>{ minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+W); maxY=Math.max(maxY,n.y+H); });
    const PAD=60;
    const offX = -minX+PAD, offY = -minY+PAD;
    const totalW = maxX-minX+PAD*2, totalH = maxY-minY+PAD*2;

    canvasWrap.style.width = totalW+'px';
    canvasWrap.style.height = totalH+'px';
    canvasWrap.innerHTML = `<svg width="${totalW}" height="${totalH}" style="position:absolute;top:0;left:0;pointer-events:none;"></svg>`;
    const svg = canvasWrap.querySelector('svg');

    function edgePoints(px,py,cx,cy){
      const dx = cx-px, dy = cy-py;
      let x1,y1,x2,y2;
      if(Math.abs(dx) >= Math.abs(dy)){
        x1 = px + (dx>=0 ? W : 0); y1 = py+H/2;
        x2 = cx + (dx>=0 ? 0 : W); y2 = cy+H/2;
      } else {
        x1 = px+W/2; y1 = py + (dy>=0 ? H : 0);
        x2 = cx+W/2; y2 = cy + (dy>=0 ? 0 : H);
      }
      return [x1,y1,x2,y2];
    }
    function drawEdges(n){
      n.children.forEach(c=>{
        const [x1,y1,x2,y2] = edgePoints(n.x+offX, n.y+offY, c.x+offX, c.y+offY);
        const midX=(x1+x2)/2, midY=(y1+y2)/2;
        const p = document.createElementNS('http://www.w3.org/2000/svg','path');
        const horiz = Math.abs(x2-x1) >= Math.abs(y2-y1);
        const d = horiz
          ? `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`
          : `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
        p.setAttribute('d', d);
        p.setAttribute('stroke','rgba(var(--text-muted-rgb),0.18)'); p.setAttribute('stroke-width','2'); p.setAttribute('fill','none');
        svg.appendChild(p);
        drawEdges(c);
      });
    }
    drawEdges(root2);

    function updateEdgesFor(){ svg.innerHTML=''; drawEdges(liveRoot()); }

    flatAll.forEach(n=>{
      const el = document.createElement('div');
      const sel = mmSelectedId[currentSubject]===n.id;
      el.dataset.nodeId = n.id;
      const sx = n.x+offX, sy = n.y+offY;
      const bgColor = colorForNode(n);
      const txtColor = textColorFor(bgColor);
      el.style.cssText = `position:absolute;left:${sx}px;top:${sy}px;width:${W}px;height:${H}px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:${bgColor};color:${txtColor};border:1.5px solid ${sel?'#fff':'rgba(var(--border-rgb),0.12)'};border-radius:9px;padding:0 8px;font-size:12px;font-weight:${n.id==='root'?'700':'500'};cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;`;

      if(editingId === n.id){
        el.style.overflow = 'visible';
        el.innerHTML = `<input id="inlineEdit" lang="ko" value="${(n.label||'').replace(/"/g,'&quot;')}" placeholder="키워드 입력" style="width:100%;height:100%;background:var(--desk-2);border:1.5px solid var(--blue);border-radius:8px;color:var(--paper);font-size:12px;text-align:center;padding:0 20px 0 6px;box-sizing:border-box;touch-action:manipulation;-webkit-user-select:text;user-select:text;"><button id="inlineEditClear" title="전체 지우기" style="position:absolute;right:3px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:10px;line-height:16px;padding:0;cursor:pointer;">×</button>`;
      } else {
        el.textContent = n.label || '(입력 필요)';
        el.addEventListener('click', (e)=>{
          if(dragMoved) return;
          mmSelectedId[currentSubject]=n.id; draw();
        });
      }
      canvasWrap.appendChild(el);

      const nodeId = n.id;
      if(editingId !== n.id){
        const addBtn = document.createElement('button');
        addBtn.textContent = '＋';
        addBtn.title = '자식 키워드 추가';
        addBtn.style.cssText = `position:absolute;left:${sx+W-9}px;top:${sy+H-9}px;width:19px;height:19px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:12px;cursor:pointer;line-height:19px;padding:0;`;
        addBtn.addEventListener('click', (e)=>{ e.stopPropagation(); addChildTo(nodeId); });
        canvasWrap.appendChild(addBtn);

        if(n.id !== 'root'){
          const delBtn = document.createElement('button');
          delBtn.textContent = '×';
          delBtn.title = '삭제';
          delBtn.style.cssText = `position:absolute;left:${sx+W-9}px;top:${sy-9}px;width:18px;height:18px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:11px;cursor:pointer;line-height:18px;padding:0;`;
          delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteNode(nodeId); });
          canvasWrap.appendChild(delBtn);
        }
      }

      // ---------- 드래그 (중앙=이동, 가장자리=펜으로 선 그어서 자녀 만들기) ----------
      let dragging=false, spawning=false, sxStart=0, syStart=0, oxStart=0, oyStart=0;
      let spawnLine = null;
      const EDGE = 14;
      el.addEventListener('pointerdown', (e)=>{
        if(editingId === n.id) return;
        const rect = el.getBoundingClientRect();
        const lx = e.clientX-rect.left, ly = e.clientY-rect.top;
        const nearEdge = lx<EDGE || ly<EDGE || (rect.width-lx)<EDGE || (rect.height-ly)<EDGE;
        el.setPointerCapture(e.pointerId);
        if(nearEdge){
          spawning = true; dragMoved = false;
          sxStart=e.clientX; syStart=e.clientY;
          spawnLine = document.createElementNS('http://www.w3.org/2000/svg','line');
          spawnLine.setAttribute('stroke','var(--blue)'); spawnLine.setAttribute('stroke-width','2.5'); spawnLine.setAttribute('stroke-dasharray','5,4');
          const startX = n.x+offX+W/2, startY = n.y+offY+H/2;
          spawnLine.setAttribute('x1', startX); spawnLine.setAttribute('y1', startY);
          spawnLine.setAttribute('x2', startX); spawnLine.setAttribute('y2', startY);
          svg.appendChild(spawnLine);
        } else {
          dragging = true; dragMoved = false;
          el.style.cursor = 'grabbing';
          sxStart=e.clientX; syStart=e.clientY; oxStart=n.x; oyStart=n.y;
        }
      });
      el.addEventListener('pointermove', (e)=>{
        if(spawning){
          const dx = e.clientX-sxStart, dy = e.clientY-syStart;
          if(Math.abs(dx)>3 || Math.abs(dy)>3) dragMoved = true;
          const shell = wrap.querySelector('#mmCanvasShell');
          const shellRect = shell.getBoundingClientRect();
          const localX = e.clientX-shellRect.left+shell.scrollLeft, localY = e.clientY-shellRect.top+shell.scrollTop;
          if(spawnLine){ spawnLine.setAttribute('x2', localX); spawnLine.setAttribute('y2', localY); }
          return;
        }
        if(!dragging) return;
        const dx = e.clientX-sxStart, dy = e.clientY-syStart;
        if(Math.abs(dx)>3 || Math.abs(dy)>3) dragMoved = true;
        const liveNode = findNode(liveRoot(), nodeId) || n;
        liveNode.x = oxStart+dx; liveNode.y = oyStart+dy;
        el.style.left = (liveNode.x+offX)+'px'; el.style.top = (liveNode.y+offY)+'px';
        updateEdgesFor();
      });
      ['pointerup','pointercancel'].forEach(evt=>{
        el.addEventListener(evt, (e)=>{
          if(spawning){
            spawning = false;
            const endX = parseFloat(spawnLine?.getAttribute('x2')||0), endY = parseFloat(spawnLine?.getAttribute('y2')||0);
            if(spawnLine) spawnLine.remove();
            if(dragMoved){
              addChildTo(nodeId, {x: endX-offX, y: endY-offY});
            }
            return;
          }
          if(!dragging) return;
          dragging = false; el.style.cursor='grab';
          if(dragMoved) draw();
        });
      });
    });
    let dragMoved = false;

    const inlineInput = canvasWrap.querySelector('#inlineEdit');
    if(inlineInput){
      requestAnimationFrame(()=>{ inlineInput.focus(); inlineInput.select(); });
      inlineInput.addEventListener('pointerdown', e=> e.stopPropagation());
      const editingNodeId = editingId;
      const commit = ()=>{
        const r = liveRoot();
        const node = r ? findNode(r, editingNodeId) : null;
        if(node) node.label = inlineInput.value.trim() || '새 키워드';
        editingId = null;
        draw();
      };
      inlineInput.addEventListener('blur', commit);
      inlineInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inlineInput.blur(); } });
      canvasWrap.querySelector('#inlineEditClear')?.addEventListener('pointerdown', e=>{
        e.stopPropagation(); e.preventDefault();
        inlineInput.value = ''; inlineInput.focus();
      });
    }

    const selId = mmSelectedId[currentSubject];
    const selNode = selId ? findNode(root2, selId) : null;
    if(!selNode){
      panel.innerHTML = `<div style="color:rgba(var(--text-muted-rgb),0.35);font-size:12px;line-height:1.6;">노드를 탭하면 상세 개념을 정리할 수 있어요.<br><br>노드 우측 하단 <b style="color:var(--blue-soft)">＋</b> 로 자식 키워드를 바로 추가하고, 노드를 드래그해서 원하는 위치로 옮길 수 있어요.</div>`;
      return;
    }
    panel.innerHTML = `
      <div class="field" style="margin-bottom:10px;">
        <label>키워드</label>
        <div style="position:relative;">
          <input id="mmLabel" lang="ko" value="${selNode.label.replace(/"/g,'&quot;')}" style="width:100%;padding-right:30px;box-sizing:border-box;">
          <button id="mmLabelClear" title="전체 지우기" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer;">×</button>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;color:rgba(var(--text-muted-rgb),0.45);text-transform:uppercase;display:block;margin-bottom:6px;">색상 <span style="font-weight:400;text-transform:none;">(깊이별 자동 · 직접 지정 가능)</span></label>
        <div id="nodeColorRow" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"></div>
      </div>
      <div class="field" style="margin-bottom:10px;"><label>상세 개념</label><textarea id="mmDetail" class="content-text" lang="ko" style="min-height:100px;">${selNode.detail||''}</textarea></div>
      <div style="display:flex;gap:8px;">
        <button class="btn blue" id="mmAdd" style="flex:1;">＋ 자식추가</button>
        ${selNode.id!=='root' ? '<button class="btn danger" id="mmDel">삭제</button>' : ''}
      </div>
    `;
    const colorRow = panel.querySelector('#nodeColorRow');
    NODE_COLOR_CHOICES.forEach(c=>{
      const b = document.createElement('button');
      const isActive = selNode.color === c;
      b.style.cssText = `width:24px;height:24px;border-radius:50%;background:${c};border:2px solid ${isActive?'#fff':'transparent'};box-shadow:0 0 0 1px rgba(var(--border-rgb),0.15);cursor:pointer;`;
      b.addEventListener('click', ()=>{
        const r = liveRoot(); const node = findNode(r, selId);
        if(node) node.color = c;
        draw();
      });
      colorRow.appendChild(b);
    });
    const resetBtn = document.createElement('button');
    resetBtn.textContent = '기본값';
    resetBtn.style.cssText = 'font-size:10.5px;padding:5px 9px;border-radius:999px;border:1px solid rgba(var(--border-rgb),0.15);background:none;color:rgba(var(--text-muted-rgb),0.6);cursor:pointer;';
    resetBtn.addEventListener('click', ()=>{
      const r = liveRoot(); const node = findNode(r, selId);
      if(node) delete node.color;
      draw();
    });
    colorRow.appendChild(resetBtn);
    panel.querySelector('#mmLabel').addEventListener('input', e=>{
      const r = liveRoot();
      const node = findNode(r, selId);
      if(!node) return;
      node.label = e.target.value || '새 키워드';
      const nodeEl = canvasWrap.querySelector(`[data-node-id="${selId}"]`);
      if(nodeEl) nodeEl.textContent = node.label;
    });
    panel.querySelector('#mmLabel').addEventListener('blur', ()=> draw());
    panel.querySelector('#mmLabelClear').addEventListener('click', ()=>{
      const input = panel.querySelector('#mmLabel');
      input.value = ''; input.focus();
      const r = liveRoot(); const node = findNode(r, selId);
      if(node) node.label = '새 키워드';
    });
    panel.querySelector('#mmDetail').addEventListener('input', e=>{
      const r = liveRoot();
      const node = findNode(r, selId);
      if(node) node.detail = e.target.value;
    });
    panel.querySelector('#mmAdd').addEventListener('click', ()=> addChildTo(selId));
    const delBtn2 = panel.querySelector('#mmDel');
    if(delBtn2) delBtn2.addEventListener('click', ()=> deleteNode(selId));
  }
  draw();
}

/* ============================== CHUNK ============================== */
function renderChunk(root){
  const wrap = document.createElement('div');
  wrap.className = 'pad';
  wrap.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <select id="chunkSubjectSelect" style="background:var(--desk-2);border:1px solid rgba(var(--border-rgb),0.1);color:var(--paper);border-radius:999px;padding:9px 12px;font-size:12.5px;">${SUBJECTS.map(s=>`<option>${s}</option>`).join('')}</select>
      <button class="btn primary" id="addChunkBtn">＋ 새 청크</button>
    </div>
    <div id="chunkBoard" style="background:var(--desk-2);border-radius:14px;min-height:320px;position:relative;overflow:auto;padding:6px;"></div>
  `;
  root.appendChild(wrap);

  wrap.querySelector('#addChunkBtn').addEventListener('click', ()=>{
    const subject = wrap.querySelector('#chunkSubjectSelect').value;
    store.chunks.push({id:store.nextChunkId++, text:'새 청크', subject, color:Math.floor(Math.random()*STICKY_COLORS.length), x:20+Math.random()*180, y:20+Math.random()*120});
    draw();
  });

  function draw(){
    const board = wrap.querySelector('#chunkBoard');
    board.innerHTML = '';
    store.chunks.forEach(chunk=>{
      const c = STICKY_COLORS[chunk.color];
      const el = document.createElement('div');
      el.style.cssText = `position:absolute;left:${chunk.x}px;top:${chunk.y}px;width:150px;min-height:100px;background:${c.bg};color:${c.text};border-radius:4px;padding:10px;box-shadow:0 5px 12px rgba(0,0,0,0.3);cursor:grab;transform:rotate(${((chunk.id*37)%7)-3}deg);touch-action:none;`;
      el.innerHTML = `
        <div style="font-size:9.5px;font-weight:700;background:rgba(0,0,0,0.12);display:inline-block;padding:2px 7px;border-radius:999px;margin-bottom:6px;">${chunk.subject}</div>
        <textarea lang="ko" style="width:100%;border:none;background:none;resize:none;outline:none;font-family:'Noto Sans KR',sans-serif;font-size:11.5px;color:inherit;min-height:50px;">${chunk.text}</textarea>
        <button class="del" style="position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;border:none;background:rgba(0,0,0,0.15);color:inherit;font-size:10px;cursor:pointer;">×</button>
      `;
      el.querySelector('textarea').addEventListener('input', e=> chunk.text = e.target.value);
      el.querySelector('.del').addEventListener('click', ()=>{ store.chunks = store.chunks.filter(c2=>c2.id!==chunk.id); draw(); });
      let dragging=false,sx,sy,ox,oy;
      el.addEventListener('pointerdown', e=>{
        if(e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON') return;
        dragging=true; el.setPointerCapture(e.pointerId); sx=e.clientX; sy=e.clientY; ox=chunk.x; oy=chunk.y;
      });
      el.addEventListener('pointermove', e=>{
        if(!dragging) return;
        chunk.x = Math.max(0, ox+(e.clientX-sx)); chunk.y = Math.max(0, oy+(e.clientY-sy));
        el.style.left = chunk.x+'px'; el.style.top = chunk.y+'px';
      });
      ['pointerup','pointercancel'].forEach(ev=> el.addEventListener(ev, ()=> dragging=false));
      board.appendChild(el);
    });
  }
  draw();
}

/* ---------- jsPDF 한글 폰트 (나눔고딕) 캐시 로더 ---------- */
let _koreanFontBase64 = null, _koreanFontBoldBase64 = null;
function arrayBufferToBase64(buf){
  let binary = '';
  const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for(let i=0; i<bytes.length; i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}
async function ensureKoreanFont(doc){
  if(!_koreanFontBase64){
    const res = await fetch('https://cdn.jsdelivr.net/font-nanum/1.0/nanumgothic/v3/NanumGothic-Regular.ttf');
    _koreanFontBase64 = arrayBufferToBase64(await res.arrayBuffer());
  }
  if(!_koreanFontBoldBase64){
    const res2 = await fetch('https://cdn.jsdelivr.net/font-nanum/1.0/nanumgothic/v3/NanumGothic-Bold.ttf');
    _koreanFontBoldBase64 = arrayBufferToBase64(await res2.arrayBuffer());
  }
  doc.addFileToVFS('NanumGothic-Regular.ttf', _koreanFontBase64);
  doc.addFont('NanumGothic-Regular.ttf', 'NanumGothic', 'normal');
  doc.addFileToVFS('NanumGothic-Bold.ttf', _koreanFontBoldBase64);
  doc.addFont('NanumGothic-Bold.ttf', 'NanumGothic', 'bold');
  doc.setFont('NanumGothic', 'normal');
}

function loadImageDims(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve({w:img.naturalWidth, h:img.naturalHeight});
    img.onerror = reject;
    img.src = dataUrl;
  });
}
function imageFormatOf(dataUrl){
  const m = dataUrl.match(/^data:image\/(\w+);base64,/);
  if(!m) return 'JPEG';
  const t = m[1].toLowerCase();
  if(t==='jpg') return 'JPEG';
  return t.toUpperCase();
}

async function loadStoreFromFirestore(uid){
  const ref = db.collection('users').doc(uid).collection('data');
  const [metaSnap, notesSnap, mapsSnap, chunksSnap] = await Promise.all([
    ref.doc('meta').get(), ref.doc('notes').get(), ref.doc('mindmaps').get(), ref.doc('chunks').get(),
  ]);
  const fresh = emptyStore();
  if(metaSnap.exists){
    const m = metaSnap.data();
    fresh.examDate = m.examDate || fresh.examDate;
    fresh.showDday = (m.showDday !== undefined) ? m.showDday : fresh.showDday;
    fresh.nextNoteId = m.nextNoteId || 1;
    fresh.nextChunkId = m.nextChunkId || 1;
    fresh.nextCollectionId = m.nextCollectionId || 1;
    fresh.collections = m.collections || [];
  }
  if(notesSnap.exists) fresh.notes = notesSnap.data().items || [];
  if(mapsSnap.exists) fresh.mindmaps = mapsSnap.data().items || {};
  if(chunksSnap.exists) fresh.chunks = chunksSnap.data().items || [];
  return fresh;
}

function loginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg; el.style.display = 'block';
}

if(FIREBASE_ENABLED){
  showLoginGate(true);
  document.getElementById('loginBtn').addEventListener('click', ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    auth.signInWithEmailAndPassword(email, pw).catch(err=> loginError(err.message));
  });
  document.getElementById('signupBtn').addEventListener('click', ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    auth.createUserWithEmailAndPassword(email, pw).catch(err=> loginError(err.message));
  });
  document.getElementById('logoutTopBtn').addEventListener('click', ()=>{
    if(confirm('로그아웃할까요?')) auth.signOut();
  });
  document.getElementById('refreshTopBtn').addEventListener('click', manualRefresh);
  auth.onAuthStateChanged(async (user)=>{
    const logoutTopBtn = document.getElementById('logoutTopBtn');
    const refreshTopBtn = document.getElementById('refreshTopBtn');
    if(user){
      currentUser = user;
      const loaded = await loadStoreFromFirestore(user.uid);
      store = makeReactiveTop(loaded);
      showLoginGate(false);
      logoutTopBtn.style.display = '';
      refreshTopBtn.style.display = '';
      switchTab('home');
    } else {
      currentUser = null;
      logoutTopBtn.style.display = 'none';
      refreshTopBtn.style.display = 'none';
      showLoginGate(true);
    }
  });
} else {
  switchTab('home');
}
</script>
</body>
</html>
